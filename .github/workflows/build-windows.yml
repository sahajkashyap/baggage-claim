name: build
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 115     # the whole job; a Windows minute is charged against the free allowance (Sep 30: packet tests added; the Sep 29 builds took up to 85 minutes)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install packages
        run: python -m pip install --quiet pillow numpy scipy winsdk pillow-heif pypdfium2 pypdf reportlab pyinstaller
      - name: Unit tests on a real Windows machine (informational)
        continue-on-error: true
        shell: pwsh
        run: |
          python -m unittest discover -s tests 2>&1 | Tee-Object -FilePath tests-on-build-machine.txt | Select-Object -Last 15
      # What this machine's reader reads, label by label: typed names at every size and every way up,
      # what the reader says about the turn, and a one-word name on a paper hung upside down, sorted by
      # the program itself. A record, not a test: it asserts nothing. Every line is kept.
      - name: Reader probe on the build machine (informational)
        continue-on-error: true
        timeout-minutes: 20
        shell: pwsh
        run: |
          python tests/reader_probe.py 2>&1 | Tee-Object -FilePath reader-probe-on-build-machine.txt
      # The whole grid of practice walls, read by this machine's own reader. Every line is kept:
      # the score, each wall, and for a wall that missed, what the tool itself said about it.
      - name: Contract check on the build machine (informational)
        continue-on-error: true
        timeout-minutes: 45
        shell: pwsh
        run: |
          python tests/contract_check.py "corner-tl" "pieces-1" "pieces-9" "pieces-25" "bg-" "side-left-0.12" "wrong-tag-6" "sentences corner-tl" "portrait-paper" "heic" "touching-6" 2>&1 | Tee-Object -FilePath contract-on-build-machine.txt
      - name: "Build BaggageClaim.exe (console, for check, one-off runs, visible watcher)"
        run: pyinstaller --onefile --name BaggageClaim --collect-all winsdk --collect-all pillow_heif --collect-all pypdfium2 --collect-all pypdfium2_raw --hidden-import pypdf --hidden-import vision_windows baggage_claim.py
      - name: "Build BaggageClaimWatcher.exe (no window, the background watcher)"
        run: pyinstaller --onefile --noconsole --name BaggageClaimWatcher --collect-all winsdk --collect-all pillow_heif --collect-all pypdfium2 --collect-all pypdfium2_raw --hidden-import pypdf --hidden-import vision_windows --hidden-import baggage_claim watcher_entry.py
      - name: "Self-check on the build machine (informational, no folders here)"
        continue-on-error: true
        shell: pwsh
        run: |
          dist\BaggageClaim.exe --check 2>&1 | Tee-Object -FilePath dist\selfcheck-on-build-machine.txt
      - name: Assemble the bundle
        shell: pwsh
        run: |
          Copy-Item windows\*.bat dist\
          Copy-Item settings.example.json, README.md, ENGINEERING-NOTES.md, SETUP-WINDOWS.md dist\
          Move-Item tests-on-build-machine.txt dist\ -ErrorAction SilentlyContinue
          Move-Item reader-probe-on-build-machine.txt dist\ -ErrorAction SilentlyContinue
          Move-Item contract-on-build-machine.txt dist\ -ErrorAction SilentlyContinue
          Get-ChildItem dist
      - uses: actions/upload-artifact@v4
        with:
          name: BaggageClaim-windows
          path: dist/

  # The Mac bundle is built and tested on the owner's own Mac, which costs nothing.
  # On GitHub a Mac minute counts about five times a Windows minute, so this job
  # runs only when it is started by hand (Actions > build > Run workflow), never on a push.
  build-mac:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install packages
        run: python -m pip install --quiet pillow numpy scipy pillow-heif pypdfium2 pypdf reportlab pyinstaller
      - name: Build the Vision helper
        run: swiftc -O vision.swift -o vision
      - name: "Build Baggage Claim.app (the small launchd helper that lets macOS ask for Drive permission)"
        run: zsh mac/autostart.sh build .
      - name: Unit tests on a real Mac (informational)
        continue-on-error: true
        run: python -m unittest discover -s tests 2>&1 | tee tests-on-build-machine.txt | tail -15
      # What this machine's reader reads, label by label: the same record the Windows build keeps,
      # so the two readers can be held side by side. A record, not a test. Every line is kept.
      - name: Reader probe on the build machine (informational)
        continue-on-error: true
        timeout-minutes: 60
        run: python tests/reader_probe.py 2>&1 | tee reader-probe-on-build-machine.txt
      # The whole grid of practice walls, read by this machine's own reader. Every line is kept:
      # the score, each wall, and for a wall that missed, what the tool itself said about it.
      - name: Contract check on the build machine (informational)
        continue-on-error: true
        timeout-minutes: 120
        run: python tests/contract_check.py 2>&1 | tee contract-on-build-machine.txt
      # The one program in the Mac bundle. launchd runs Baggage Claim.app, which runs watch.sh,
      # which runs this. No second, windowless watcher app is built: nothing starts one, and a
      # teacher who double-clicked it got a watcher that nothing restarts.
      - name: "Build baggage-claim (the one program: check, one-off runs, and the watcher)"
        run: pyinstaller --onefile --name baggage-claim --add-binary "vision:." --collect-all pillow_heif --collect-all pypdfium2 --collect-all pypdfium2_raw --hidden-import pypdf --hidden-import vision_windows baggage_claim.py
      - name: "Self-check on the build machine (informational, no folders here)"
        continue-on-error: true
        run: ./dist/baggage-claim --check 2>&1 | tee dist/selfcheck-on-build-machine.txt
      - name: Assemble the bundle
        run: |
          cp mac/*.command mac/autostart.sh watch.sh dist/
          cp -R "Baggage Claim.app" dist/
          cp settings.example.json README.md ENGINEERING-NOTES.md dist/
          mv tests-on-build-machine.txt dist/ || true
          mv reader-probe-on-build-machine.txt dist/ || true
          mv contract-on-build-machine.txt dist/ || true
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: BaggageClaim-mac
          path: dist/
